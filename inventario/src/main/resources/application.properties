spring.application.name=inventario
server.port=${PORT:6771}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_frank}
spring.datasource.username=${DATABASE_USERNAME:frank}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
